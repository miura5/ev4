# B-64 (O-3): npm test on every push and pull request, the personal-data test included. The page harnesses and the
# look pass need Chromium and the synthetic record, so they stay `npm run check` in a build session.
# B-262: not for a push that changes only the record (chart/ and the files generated from it) or docs/. Those are most
# pushes, and on Oct 23 they used up the account's free Actions minutes; npm test runs locally before each of them.
# Every pull request still runs it.
name: npm test
on:
  push:
    paths-ignore:
      - 'chart/**'
      - 'BACKLOG.md'
      - 'DECISIONS.md'
      - 'CHANGELOG.md'
      - 'docs/**'
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Some tests make commits in throwaway repositories (the chart, rollback); a runner has no git identity.
      - run: git config --global user.name 'E.V. CI' && git config --global user.email 'ci@example.invalid'
      - run: npx prettier --check .
      - run: npm test
