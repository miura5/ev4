# B-311: the app's staging pair on Matt's Cloudflare account: the ev-staging D1 (found, or created once) holding the
# made-up record only (test/data/synthetic.cjs through pwa/seed.mjs, seeded only while the database is empty, so
# nothing is ever deleted there), and the ev-staging Worker serving the staging page with its own token. Then the
# check: /api/db answers 401 without the token, and with it every seed document is there and the rest came from known
# writers (the suite, the app's jobs, the staging page; B-389). B-312: the
# version column is added once to a D1 made before it, and the run API suite (pwa/run-api.test.mjs) runs against the
# Worker; it writes only into its own collection, and nothing is deleted. B-324: with the input jobs set to true, one
# real Haiku job of each kind is started from the app's page in Chromium, run through the shim and the Worker, and read
# back from the staging D1 (tools/pwa-jobs.mjs); what it writes carries the app's source and is additive. B-316: the
# ev-staging-exports R2 bucket is created once (the Worker's nightly export writes there); with the input backup set
# to true, Time Travel is read for the staging D1, an export is made now, and the newest export is restored into a new
# table of the ev-staging-scratch D1 and checked for counts and SHA-256 hashes per collection (tools/pwa-backup.mjs).
# Exports are never overwritten or deleted, and each restore goes into a table of its own.
# Started by hand only (gh workflow run pwa-staging.yml): never on a push or a pull request, and staging only; the live
# Worker and a live D1 are never named here. Secrets reach wrangler and the check through the environment or stdin,
# never on a command line or in the log.
# B-318: ship staging prints this workflow's dispatch at the build's commit (input commit) and reads the run back
# through the GitHub API: the deploy tags the Worker version with the build hash (tools/pwa-app.mjs message), and the
# last check reads the active version's tag and every served page file back, then leaves the hash as a notice.
name: pwa-staging
run-name: pwa-staging ${{ inputs.commit || github.sha }}
on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'B-318: the commit to build and deploy (ship staging passes the build commit); empty for the branch head'
        type: string
        default: ''
      jobs:
        description: 'B-324: also run one real Haiku job of each kind and read it back from the staging D1'
        type: boolean
        default: false
      backup:
        description: 'B-316: also check Time Travel, make an export now and restore the newest into a scratch D1'
        type: boolean
        default: false
      copy_target:
        description: 'B-319: only deploy the ev-staging-scratch Worker over the ev-staging-scratch D1 (the copy tool imports there) and print its counts and hashes; ev-staging is not deployed or touched'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pwa-staging
  cancel-in-progress: false
jobs:
  staging:
    if: ${{ !inputs.copy_target }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EV_STAGING_TOKEN: ${{ secrets.EV_STAGING_TOKEN }}
      ANTHROPIC_API_KEY_STAGING: ${{ secrets.ANTHROPIC_API_KEY_STAGING }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: the four secrets are set
        run: |
          missing=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID EV_STAGING_TOKEN ANTHROPIC_API_KEY_STAGING; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "missing Actions secrets:$missing"; exit 1; fi
          echo "all four set"
      - uses: actions/checkout@v4
        with:
          # B-318: the build's own commit, with its tags, so the page carries the same release as ship's build.
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            pwa/package-lock.json
      - run: npm ci
      - run: npm ci --prefix pwa
      - name: build the staging page and wrap it
        working-directory: pwa
        run: npm run build
      - name: find or create the ev-staging D1
        working-directory: pwa
        run: |
          id_of() { npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const d=JSON.parse(s).find(x=>x.name==="ev-staging");process.stdout.write(d?d.uuid:"")})'; }
          id=$(id_of)
          if [ -z "$id" ]; then npx wrangler d1 create ev-staging >/dev/null; id=$(id_of); fi
          [ -n "$id" ] || { echo "ev-staging D1 not found after create"; exit 1; }
          echo "ev-staging D1: $id"
          sed -i "s/filled-in-by-the-pwa-staging-workflow/$id/" wrangler.toml
          grep -q "database_id = \"$id\"" wrangler.toml
      - name: the schema, and the made-up record while the database is empty
        working-directory: pwa
        run: |
          npx wrangler d1 execute ev-staging --env staging --remote --file schema.sql >/dev/null
          n=$(npx wrangler d1 execute ev-staging --env staging --remote --json --command "SELECT COUNT(*) AS n FROM docs" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(String(JSON.parse(s)[0].results[0].n)))')
          echo "documents before: $n"
          if [ "$n" = "0" ]; then
            node seed.mjs --append > seed.sql
            npx wrangler d1 execute ev-staging --env staging --remote --file seed.sql >/dev/null
            echo "seeded with the made-up record"
          else
            echo "not empty: left as it is"
          fi
      - name: the version column (B-312), added once to a D1 made before it
        working-directory: pwa
        run: |
          n=$(npx wrangler d1 execute ev-staging --env staging --remote --json --command "SELECT COUNT(*) AS n FROM pragma_table_info('docs') WHERE name = 'v'" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(String(JSON.parse(s)[0].results[0].n)))')
          if [ "$n" = "0" ]; then
            npx wrangler d1 execute ev-staging --env staging --remote --command "ALTER TABLE docs ADD COLUMN v INTEGER NOT NULL DEFAULT 1" >/dev/null
            echo "version column added: every document at version 1"
          else
            echo "version column already there"
          fi
      - name: the ev-staging-exports R2 bucket (B-316), created once, and the nightly export bound when it is there
        id: r2
        working-directory: pwa
        run: |
          if npx wrangler r2 bucket info ev-staging-exports >/dev/null 2>&1; then
            echo "ev-staging-exports already there"
          elif npx wrangler r2 bucket create ev-staging-exports > r2.log 2>&1; then
            echo "ev-staging-exports created"
          else
            grep -o 'Please enable R2[^[]*\[code: [0-9]*\]' r2.log || tail -5 r2.log
            echo "r2=off" >> "$GITHUB_OUTPUT"
            echo "no R2 bucket: the Worker deploys without the nightly export (R2 is turned on in the Cloudflare dashboard)"
            exit 0
          fi
          printf '\n[[env.staging.r2_buckets]]\nbinding = "EXPORTS"\nbucket_name = "ev-staging-exports"\n\n[env.staging.triggers]\ncrons = ["17 8 * * *"]\n' >> wrangler.toml
          echo "r2=on" >> "$GITHUB_OUTPUT"
          echo "the nightly export is bound: EXPORTS -> ev-staging-exports, cron 17 8 * * *"
      - name: deploy the ev-staging Worker
        id: deploy
        working-directory: pwa
        run: |
          msg=$(node ../tools/pwa-app.mjs message staging)
          echo "the version's build hash: $msg"
          npx wrangler deploy --env staging --message "$msg" > deploy.log 2>&1 || { cat deploy.log; exit 1; }
          url=$(grep -o 'https://ev-staging\.[a-z0-9.-]*\.workers\.dev' deploy.log | head -1)
          [ -n "$url" ] || { cat deploy.log; echo "no workers.dev address in the deploy output"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "ev-staging Worker: $url"
      - name: the Worker's secrets, from the Actions secrets
        working-directory: pwa
        run: |
          printf '%s' "$EV_STAGING_TOKEN" | npx wrangler secret put EV_TOKEN --env staging >/dev/null
          printf '%s' "$ANTHROPIC_API_KEY_STAGING" | npx wrangler secret put ANTHROPIC_API_KEY --env staging >/dev/null
          echo "EV_TOKEN and ANTHROPIC_API_KEY set on ev-staging"
      - name: check (401 without the token; with it every seed document there, the rest from known writers)
        env:
          EV_TOKEN: ${{ secrets.EV_STAGING_TOKEN }}
        run: |
          for i in 1 2 3 4 5 6; do
            if node tools/pwa-staging.mjs check "${{ steps.deploy.outputs.url }}"; then exit 0; fi
            echo "retrying in 10 s (a new secret can take a moment to reach the Worker)"; sleep 10
          done
          exit 1
      - name: the Worker's build hash and its page files, read back (B-318)
        run: node tools/pwa-app.mjs deployed staging "${{ steps.deploy.outputs.url }}"
      - name: the run API suite against the staging Worker (B-312)
        env:
          EV_TOKEN: ${{ secrets.EV_STAGING_TOKEN }}
          EV_RUN_API_URL: ${{ steps.deploy.outputs.url }}
        run: node --test pwa/run-api.test.mjs
      - name: one real Haiku job of each kind, read back from the staging D1 (B-324)
        if: ${{ inputs.jobs }}
        env:
          EV_TOKEN: ${{ secrets.EV_STAGING_TOKEN }}
        run: |
          npx playwright install --with-deps chromium >/dev/null
          node tools/pwa-jobs.mjs "${{ steps.deploy.outputs.url }}" shots-jobs
      - name: Time Travel is on for the staging D1 (B-316)
        if: ${{ inputs.backup }}
        working-directory: pwa
        run: |
          npx wrangler d1 time-travel info ev-staging --env staging > tt.log 2>&1 || { cat tt.log; exit 1; }
          grep -i "bookmark" tt.log || { cat tt.log; echo "no Time Travel bookmark for ev-staging"; exit 1; }
      - name: an export now, then the newest export restored into a scratch D1 and checked (B-316)
        if: ${{ inputs.backup }}
        working-directory: pwa
        env:
          EV_TOKEN: ${{ secrets.EV_STAGING_TOKEN }}
          BASE: ${{ steps.deploy.outputs.url }}
        run: |
          [ "${{ steps.r2.outputs.r2 }}" = "on" ] || { echo "no R2 bucket on the account yet: no export to restore"; exit 1; }
          node -e 'const b=process.env.BASE,h={authorization:"Bearer "+process.env.EV_TOKEN};(async()=>{const r=await fetch(b+"/api/backup/export",{method:"POST",headers:h});const e=await r.json();if(r.status!==200)throw new Error("export: "+r.status+" "+JSON.stringify(e));console.log("export made:",e.key,Object.entries(e.collections).map(([c,m])=>c+" "+m.count).join(", "));const n=await (await fetch(b+"/api/backup/newest",{headers:h})).json();if(!n.key)throw new Error("no newest export");require("fs").writeFileSync("newest.txt",n.key);console.log("newest export:",n.key)})().catch(e=>{console.error(e.message);process.exit(1)})'
          key=$(cat newest.txt)
          npx wrangler r2 object get "ev-staging-exports/$key" --remote --file export.json >/dev/null
          id_of() { npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const d=JSON.parse(s).find(x=>x.name==="ev-staging-scratch");process.stdout.write(d?d.uuid:"")})'; }
          id=$(id_of)
          if [ -z "$id" ]; then npx wrangler d1 create ev-staging-scratch >/dev/null; id=$(id_of); fi
          [ -n "$id" ] || { echo "ev-staging-scratch D1 not found after create"; exit 1; }
          printf 'name = "ev-staging-scratch"\ncompatibility_date = "2026-10-01"\n\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "ev-staging-scratch"\ndatabase_id = "%s"\n' "$id" > scratch.toml
          table="restore_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          node ../tools/pwa-backup.mjs restore-sql export.json "$table" > restore.sql
          npx wrangler d1 execute ev-staging-scratch --config scratch.toml --remote --file restore.sql >/dev/null
          npx wrangler d1 execute ev-staging-scratch --config scratch.toml --remote --json --command "SELECT c, id, data FROM $table" > rows.json
          echo "restored into ev-staging-scratch, table $table"
          node ../tools/pwa-backup.mjs verify export.json rows.json
      - uses: actions/upload-artifact@v4
        if: failure() && inputs.jobs
        with:
          name: pwa-jobs-shots-${{ github.run_id }}
          path: shots-jobs/
          retention-days: 7
          if-no-files-found: ignore

  # B-319: the target of the copy tool's staging proof (tools/pwa-copy.mjs). Its own Worker, ev-staging-scratch, runs
  # the same worker.js over the ev-staging-scratch D1 (found, or created once; the restores' tables there are left as
  # they are), with the staging token, so the copy goes through the run API into a D1 that is not ev-staging. The docs
  # table is created only when missing, and nothing here writes a document: the import runs from the build session.
  # Each run ends with the docs table's counts and SHA-256 per collection (pwa/backup.js), read with wrangler, never a
  # document, also as a notice (the run's annotations are readable where its log is not).
  copy-target:
    if: ${{ inputs.copy_target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EV_STAGING_TOKEN: ${{ secrets.EV_STAGING_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: the three secrets are set
        run: |
          missing=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID EV_STAGING_TOKEN; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "missing Actions secrets:$missing"; exit 1; fi
          echo "all three set"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - run: npm ci --prefix pwa
      - name: find or create the ev-staging-scratch D1, and its docs table when missing
        working-directory: pwa
        run: |
          id_of() { npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const d=JSON.parse(s).find(x=>x.name==="ev-staging-scratch");process.stdout.write(d?d.uuid:"")})'; }
          id=$(id_of)
          if [ -z "$id" ]; then npx wrangler d1 create ev-staging-scratch >/dev/null; id=$(id_of); fi
          [ -n "$id" ] || { echo "ev-staging-scratch D1 not found after create"; exit 1; }
          printf 'name = "ev-staging-scratch"\nmain = "worker.js"\ncompatibility_date = "2026-10-01"\nworkers_dev = true\n\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "ev-staging-scratch"\ndatabase_id = "%s"\n' "$id" > copy.toml
          npx wrangler d1 execute ev-staging-scratch --config copy.toml --remote --file schema.sql >/dev/null
          n=$(npx wrangler d1 execute ev-staging-scratch --config copy.toml --remote --json --command "SELECT COUNT(*) AS n FROM pragma_table_info('docs') WHERE name = 'v'" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(String(JSON.parse(s)[0].results[0].n)))')
          [ "$n" = "1" ] || { echo "the scratch docs table has no version column"; exit 1; }
          echo "ev-staging-scratch D1: $id, docs table ready"
      - name: deploy the ev-staging-scratch Worker
        id: deploy
        working-directory: pwa
        run: |
          npx wrangler deploy --config copy.toml > deploy.log 2>&1 || { cat deploy.log; exit 1; }
          url=$(grep -o 'https://ev-staging-scratch\.[a-z0-9.-]*\.workers\.dev' deploy.log | head -1)
          [ -n "$url" ] || { cat deploy.log; echo "no workers.dev address in the deploy output"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "ev-staging-scratch Worker: $url"
          echo "::notice title=copy target::$url"
      - name: the Worker's token, the staging one
        working-directory: pwa
        run: |
          printf '%s' "$EV_STAGING_TOKEN" | npx wrangler secret put EV_TOKEN --config copy.toml >/dev/null
          echo "EV_TOKEN set on ev-staging-scratch"
      - name: the run API answers 401 without the token
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.deploy.outputs.url }}/api/run/list?collection=health")
            [ "$code" = "401" ] && { echo "401 without the token"; exit 0; }
            echo "got $code, retrying in 10 s"; sleep 10
          done
          exit 1
      - name: the scratch docs table's counts and SHA-256 per collection
        working-directory: pwa
        run: |
          npx wrangler d1 execute ev-staging-scratch --config copy.toml --remote --json --command "SELECT c, id, data FROM docs" > rows.json
          node --input-type=module -e 'import fs from "node:fs";import {manifestOf} from "./backup.js";const a=JSON.parse(fs.readFileSync("rows.json","utf8"));const rows=(Array.isArray(a)?a:[a]).flatMap(x=>x.results||[]);const m=await manifestOf(rows);console.log("ev-staging-scratch docs: "+rows.length+" documents in "+Object.keys(m).length+" collections");const lines=Object.entries(m).map(([c,x])=>c+" "+x.count+" "+x.sha256);for(const l of lines)console.log(l);console.log("::notice title=ev-staging-scratch docs::"+rows.length+" documents%0A"+lines.join("%0A"))'
