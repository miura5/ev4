name = "ev-demo"
main = "worker.js"
compatibility_date = "2026-10-01"

# The page's files, built by `npm run build` here (tools/build-pwa.mjs).
[assets]
directory = "public"
binding = "ASSETS"

# The record. `npx wrangler d1 create ev-demo` prints the id to paste here.
[[d1_databases]]
binding = "DB"
database_name = "ev-demo"
database_id = "paste-the-id-from-d1-create"

# B-311: staging, its own Worker over its own D1, seeded with the made-up record only. Deployed only by the
# pwa-staging workflow (.github/workflows/pwa-staging.yml), which fills in the database id it finds or creates; the
# Worker's EV_TOKEN and ANTHROPIC_API_KEY secrets come from the repository's Actions secrets. Never live.
[env.staging]
name = "ev-staging"
workers_dev = true

[[env.staging.d1_databases]]
binding = "DB"
database_name = "ev-staging"
database_id = "filled-in-by-the-pwa-staging-workflow"

# B-316 (D-302): the nightly export of the staging D1 to its own R2 bucket (pwa/backup.js), at 3:17 Central (8:17 UTC
# in winter). R2 must be on for the account first; the pwa-staging workflow then creates the ev-staging-exports bucket
# once and adds its binding and the cron to [env.staging] at deploy (a binding to a missing bucket would stop the
# deploy). Exports are never overwritten or deleted.


# B-320 (D-330): live, the ev-live Worker over the ev-live D1, never seeded. Deployed only by the pwa-live workflow
# (.github/workflows/pwa-live.yml) in the GitHub environment live, which fills in the database id it finds or creates
# and adds the nightly export's R2 binding and cron; EV_TOKEN comes from the environment secret EV_LIVE_TOKEN, and the
# Claude API key is a Cloudflare secret Matt sets on ev-live (D-299).
[env.live]
name = "ev-live"
workers_dev = true

[[env.live.d1_databases]]
binding = "DB"
database_name = "ev-live"
database_id = "filled-in-by-the-pwa-live-workflow"

# B-459: a study plan job runs in the Worker, in a Durable Object per job (pwa/planjob.js PlanJob) whose alarm has 15
# minutes of wall time, whatever the page does. SQLite-backed, the kind the Workers Free plan allows. The binding is
# given in each environment (bindings are not inherited); the migration names the class once.
[[durable_objects.bindings]]
name = "PLAN_JOBS"
class_name = "PlanJob"

[[env.staging.durable_objects.bindings]]
name = "PLAN_JOBS"
class_name = "PlanJob"

[[env.live.durable_objects.bindings]]
name = "PLAN_JOBS"
class_name = "PlanJob"

[[migrations]]
tag = "v1-plan-jobs"
new_sqlite_classes = ["PlanJob"]

# B-459: the job runner's core modules import node:fs, node:path and node:url; in the Worker they get the same
# stand-ins the app's browser gets (they write nothing).
[alias]
"node:fs" = "./node-fs.mjs"
"node:path" = "./node-path.mjs"
"node:url" = "./node-url.mjs"
